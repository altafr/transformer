<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next-Word Decoder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=block">
<style>
  /* Layout: the 1280×720 film letterboxed to fill the window, a slim control bar along the bottom. One dark world. */
  :root { --bg: #000; --bar: #0c0d10; --line: #24272d; --fg: #e9ecef; --muted: #9aa3ad; --accent: #58C4DD; --yellow: #FFFF00; color-scheme: dark; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--fg); display: flex; flex-direction: column; font: 14px/1.4 "STIX Two Text", Georgia, serif; overflow: hidden; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #c { display: block; background: #000; }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bar); border-top: 1px solid var(--line); }
  .bar button { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--fg); border-radius: 4px; height: 34px; min-width: 34px; padding: 0 10px; font: 15px "STIX Two Text", Georgia, serif; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .bar button:hover { border-color: var(--muted); }
  .bar button:focus-visible, #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bar button[aria-pressed="false"] { color: var(--muted); }
  #play { min-width: 44px; }
  #play svg { width: 14px; height: 14px; fill: currentColor; }
  #scrub { flex: 1; min-width: 60px; accent-color: var(--yellow); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; min-width: 92px; text-align: right; }
  /* embedded in the site: the page sizes itself to its width and reports its height to the parent */
  html.embed, html.embed body { height: auto; }
  html.embed #stage { flex: none; aspect-ratio: 16 / 9; }
  @media (max-width: 520px) { .bar { gap: 8px; } #time { min-width: 0; font-size: 13px; } .bar .lbl { display: none; } }
</style>

</head>
<body>
<div id="stage"><canvas id="c" width="1280" height="720" aria-label="Animated explainer: how a transformer decoder picks the next word"></canvas></div>
<div class="bar">
  <button id="play" type="button" aria-label="Play"><svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg></button>
  <input id="scrub" type="range" min="0" max="86" step="0.01" value="0" aria-label="Seek">
  <span id="time">0:00.0 / 1:26</span>
  <button id="snd" type="button" aria-pressed="true" title="Sound">♪<span class="lbl"> Sound</span></button>
  <button id="loop" type="button" aria-pressed="true" title="Loop">↻<span class="lbl"> Loop</span></button>
</div>

<script>// Shared helpers + style registry for the style-frame explorations.
// Every style is a pure function of time: draw(ctx, W, H, t). Same t => same pixels.
(function () {
  const STYLES = (window.STYLES = window.STYLES || []);
  window.registerStyle = (s) => STYLES.push(s);

  const H = (window.H = {});

  // ---------- seeded randomness ----------
  // H.rng(seed) -> r() in [0,1). Extras: r.range(a,b), r.int(a,b), r.pick(arr), r.gauss(), r.chance(p)
  H.rng = function (seed = 1) {
    let a = typeof seed === 'string' ? hashStr(seed) : (seed >>> 0) || 1;
    const r = function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    r.range = (lo, hi) => lo + r() * (hi - lo);
    r.int = (lo, hi) => Math.floor(lo + r() * (hi - lo + 1));
    r.pick = (arr) => arr[Math.floor(r() * arr.length)];
    r.chance = (p) => r() < p;
    r.gauss = () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    return r;
  };
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }

  // ---------- gradient noise ----------
  // H.makeNoise(seed) -> { n2(x,y), n3(x,y,z), fbm2(x,y,oct), fbm3(x,y,z,oct) }  (outputs roughly -1..1)
  H.makeNoise = function (seed = 1) {
    const r = H.rng(seed), p = new Uint8Array(512), perm = [...Array(256).keys()];
    for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [perm[i], perm[j]] = [perm[j], perm[i]]; }
    for (let i = 0; i < 512; i++) p[i] = perm[i & 255];
    const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
    const lerp = (a, b, t) => a + (b - a) * t;
    const g3 = (h, x, y, z) => { h &= 15; const u = h < 8 ? x : y, v = h < 4 ? y : h === 12 || h === 14 ? x : z; return ((h & 1) ? -u : u) + ((h & 2) ? -v : v); };
    function n3(x, y, z) {
      const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, Z = Math.floor(z) & 255;
      x -= Math.floor(x); y -= Math.floor(y); z -= Math.floor(z);
      const u = fade(x), v = fade(y), w = fade(z);
      const A = p[X] + Y, AA = p[A] + Z, AB = p[A + 1] + Z, B = p[X + 1] + Y, BA = p[B] + Z, BB = p[B + 1] + Z;
      return lerp(lerp(lerp(g3(p[AA], x, y, z), g3(p[BA], x - 1, y, z), u), lerp(g3(p[AB], x, y - 1, z), g3(p[BB], x - 1, y - 1, z), u), v),
        lerp(lerp(g3(p[AA + 1], x, y, z - 1), g3(p[BA + 1], x - 1, y, z - 1), u), lerp(g3(p[AB + 1], x, y - 1, z - 1), g3(p[BB + 1], x - 1, y - 1, z - 1), u), v), w);
    }
    const n2 = (x, y) => n3(x, y, 0.5);
    const fbm3 = (x, y, z, oct = 4) => { let s = 0, a = 0.5, f = 1, norm = 0; for (let i = 0; i < oct; i++) { s += a * n3(x * f, y * f, z * f); norm += a; a *= 0.5; f *= 2; } return s / norm; };
    const fbm2 = (x, y, oct = 4) => fbm3(x, y, 0.5, oct);
    return { n2, n3, fbm2, fbm3 };
  };

  // ---------- math ----------
  H.lerp = (a, b, t) => a + (b - a) * t;
  H.clamp = (v, lo = 0, hi = 1) => Math.max(lo, Math.min(hi, v));
  H.map = (v, a, b, c, d) => c + ((v - a) / (b - a)) * (d - c);
  H.smooth = (e0, e1, x) => { const t = H.clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
  H.ease = {
    inOut: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    out: (t) => 1 - Math.pow(1 - t, 3),
    in: (t) => t * t * t,
    back: (t) => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  };

  // ---------- color ----------
  H.hex = (h) => { h = h.replace('#', ''); if (h.length === 3) h = h.split('').map((c) => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  H.rgba = (hexOrArr, a = 1) => { const [r, g, b] = Array.isArray(hexOrArr) ? hexOrArr : H.hex(hexOrArr); return `rgba(${r | 0},${g | 0},${b | 0},${a})`; };
  H.mix = (c1, c2, t) => { const a = Array.isArray(c1) ? c1 : H.hex(c1), b = Array.isArray(c2) ? c2 : H.hex(c2); return [0, 1, 2].map((i) => a[i] + (b[i] - a[i]) * t); };

  // ---------- canvas utilities ----------
  // Offscreen canvas of the same logical size (use for layers, masks, compositing).
  H.layer = (W, H_, ) => { const c = document.createElement('canvas'); c.width = W; c.height = H_; return c; };
  // Monochrome grain / film noise over the whole canvas. amount ~ 0.03-0.15
  H.grain = function (ctx, W, Hh, amount = 0.08, seed = 7, mono = true) {
    const img = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height), d = img.data, r = H.rng(seed), k = amount * 255;
    for (let i = 0; i < d.length; i += 4) {
      const n = (r() - 0.5) * k;
      if (mono) { d[i] += n; d[i + 1] += n; d[i + 2] += n; }
      else { d[i] += (r() - 0.5) * k; d[i + 1] += (r() - 0.5) * k; d[i + 2] += (r() - 0.5) * k; }
    }
    ctx.putImageData(img, 0, 0);
  };
  // Paper-ish texture tile: fills with base color + fibrous noise (cheap; drawn into ctx).
  H.paper = function (ctx, W, Hh, base = '#f3ecdc', seed = 3, strength = 0.06) {
    ctx.save(); ctx.fillStyle = base; ctx.fillRect(0, 0, W, Hh);
    const nz = H.makeNoise(seed), cell = 4, [br, bg, bb] = H.hex(base);
    for (let y = 0; y < Hh; y += cell) for (let x = 0; x < W; x += cell) {
      const v = nz.fbm2(x * 0.01, y * 0.01, 3) * 0.6 + nz.n2(x * 0.15, y * 0.04) * 0.4;
      const s = 1 + v * strength * 2;
      ctx.fillStyle = `rgb(${br * s | 0},${bg * s | 0},${bb * s | 0})`; ctx.fillRect(x, y, cell, cell);
    }
    ctx.restore();
  };
  // Vignette
  H.vignette = function (ctx, W, Hh, strength = 0.5, color = '0,0,0') {
    const g = ctx.createRadialGradient(W / 2, Hh / 2, Math.min(W, Hh) * 0.3, W / 2, Hh / 2, Math.hypot(W, Hh) * 0.6);
    g.addColorStop(0, `rgba(${color},0)`); g.addColorStop(1, `rgba(${color},${strength})`);
    ctx.save(); ctx.fillStyle = g; ctx.fillRect(0, 0, W, Hh); ctx.restore();
  };

  // ---------- rendering entry ----------
  // Renders style into canvas at logical 1280x720 (canvas can be any pixel size; it is scaled).
  H.W = 1280; H.H = 720;
  H.loadFonts = async function (style) {
    const specs = style.fonts || [];
    try { const sample = 'AaZz09' + (window.FONT_SAMPLE || '');
      await Promise.all(specs.map((f) => document.fonts.load(f, sample))); await document.fonts.ready; } catch (e) { /* render anyway */ }
  };
  H.render = function (style, canvas, t) {
    const ctx = canvas.getContext('2d', { willReadFrequently: !!style.readsPixels });
    const sx = canvas.width / H.W, sy = canvas.height / H.H;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.save(); ctx.scale(sx, sy);
    style.draw(ctx, H.W, H.H, t == null ? style.frameT || 0 : t);
    ctx.restore();
  };
})();
</script>
<script>// sound.js: a small synthesized sound kit for the style explainers. Plain Web Audio, no audio files.
// Voiceover mode: SOUND.kit(ctx, { voiceover: true }) drops beds and music, plays anything marked minor
// (play(..., { minor: true }), tone/noise { minor: true }, or scheduled inside k.withMinor(() => ...)) at about 60%
// volume instead of full, and sits all effects a little lower, so the narration stays on top while the piece still
// sounds alive. In the full mix, minor sounds play at full volume. Scores can read k.vo to branch further.
// A style adds   explainerSound(k) { k.bed('room', 0, D); k.play('pop', 1.25); ... }   and the same
// call schedules into a live AudioContext (the player) or an OfflineAudioContext (the video render).
// Times are seconds on the explainer's own clock. Randomness is seeded, so every render is identical.
(function () {
  'use strict';
  const SOUND = (window.SOUND = {});
  const TINY = 1e-4;

  // seeded random in [0,1), keyed by any string
  function rand(key) {
    let h = 2166136261;
    for (let i = 0; i < key.length; i++) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
    let a = h >>> 0 || 1;
    return () => { a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  // note names to Hz: 'A4' = 440, 'C#5', 'Eb3'
  const STEP = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function hz(n) {
    if (typeof n === 'number') return n;
    const m = /^([A-G])([#b]?)(-?\d)$/.exec(n);
    const semis = STEP[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (Number(m[3]) - 4) * 12 - 9;
    return 440 * Math.pow(2, semis / 12);
  }
  SOUND.hz = hz;

  SOUND.kit = function (ctx, opts) {
    const o = opts || {};
    const VO = !!o.voiceover;
    const MINOR = 0.6; // voiceover-mode volume for minor sounds
    let inMinor = false;
    const gainOf = (p, d) => (p.gain == null ? d : p.gain) * (VO && (p.minor || inMinor) ? MINOR : 1);
    const T0 = (o.start || 0) - 0; // explainer time that maps to ctx time `base`
    const base = ctx.currentTime + (o.delay || 0);
    // Start times snap to the sample grid (+ a quarter sample): in Chrome a source started a hair off the grid can
    // spike to about twice its set level.
    const SR = ctx.sampleRate;
    const at = (t) => (Math.round((base + (t - T0)) * SR) + 0.25) / SR;

    // ---- buses: sfx, amb, music -> compressor -> master; one shared reverb send
    const master = ctx.createGain(); master.gain.value = o.master == null ? 0.9 : o.master;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 3; comp.attack.value = 0.004; comp.release.value = 0.18;
    comp.connect(master); master.connect(o.dest || ctx.destination);
    const bus = {};
    for (const [name, g] of Object.entries({ sfx: VO ? 0.7 : 0.85, amb: 0.5, music: 0.45 })) { bus[name] = ctx.createGain(); bus[name].gain.value = g; bus[name].connect(comp); }

    // generated room reverb: decaying stereo noise, darker toward the tail
    const verb = ctx.createConvolver();
    {
      const secs = 1.6, n = Math.floor(secs * ctx.sampleRate), ir = ctx.createBuffer(2, n, ctx.sampleRate);
      for (let c = 0; c < 2; c++) {
        const r = rand('verb' + c), d = ir.getChannelData(c); let lp = 0;
        for (let i = 0; i < n; i++) { const u = i / n; lp += (0.6 - 0.45 * u) * ((r() * 2 - 1) - lp); d[i] = lp * Math.pow(1 - u, 3); }
      }
      verb.buffer = ir;
    }
    const verbIn = ctx.createGain(); verbIn.gain.value = 0.9; verbIn.connect(verb); verb.connect(comp);

    // seeded noise buffers: white, pink-ish and brown
    const noiseBuf = {};
    {
      const n = Math.floor(2.5 * ctx.sampleRate);
      for (const kind of ['white', 'pink', 'brown']) {
        const b = ctx.createBuffer(1, n, ctx.sampleRate), d = b.getChannelData(0), r = rand('noise-' + kind);
        let p0 = 0, p1 = 0, p2 = 0, br = 0;
        for (let i = 0; i < n; i++) {
          const w = r() * 2 - 1;
          if (kind === 'white') d[i] = w;
          else if (kind === 'pink') { p0 = 0.997 * p0 + 0.029 * w; p1 = 0.985 * p1 + 0.032 * w; p2 = 0.95 * p2 + 0.048 * w; d[i] = (p0 + p1 + p2 + w * 0.05) * 2.2; }
          else { br = (br + 0.02 * w) / 1.02; d[i] = br * 3.2; }
        }
        noiseBuf[kind] = b;
      }
    }

    // ---- automation helpers
    // a value or [[dt, value], ...] from the voice start; ramps are exponential (frequencies)
    function sweep(param, v, t) {
      if (!Array.isArray(v)) { param.setValueAtTime(v, t); return; }
      param.setValueAtTime(v[0][1], t + v[0][0]);
      for (let i = 1; i < v.length; i++) param.exponentialRampToValueAtTime(Math.max(v[i][1], 1), t + v[i][0]);
    }
    // amplitude: linear attack to `gain`, optional hold, exponential release to silence by `dur`
    function shape(param, t, gain, dur, a, hold) {
      a = Math.min(a == null ? 0.004 : a, dur * 0.9);
      hold = Math.min(hold || 0, dur - a);
      param.setValueAtTime(0, t);
      param.linearRampToValueAtTime(gain, t + a);
      if (hold > 0) param.setValueAtTime(gain, t + a + hold);
      param.exponentialRampToValueAtTime(TINY, t + dur);
      param.setValueAtTime(0, t + dur + 0.001);
    }
    function out(node, p) {
      const pan = ctx.createStereoPanner(); pan.pan.value = Math.max(-1, Math.min(1, p.pan || 0));
      node.connect(pan); pan.connect(bus[p.bus || 'sfx']);
      if (p.verb) { const s = ctx.createGain(); s.gain.value = p.verb; pan.connect(s); s.connect(verbIn); }
    }
    function filterNode(p, t) {
      if (!p.filter) return null;
      const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 1 : p.q;
      sweep(f.frequency, p.f == null ? 1000 : p.f, t);
      return f;
    }

    // ---- primitives
    // tone(t, { f, type, dur, gain, a, hold, pan, verb, bus, filter, f2 (filter freq), q, detune })
    function tone(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const osc = ctx.createOscillator(); osc.type = p.type || 'sine';
      sweep(osc.frequency, Array.isArray(p.f) ? p.f.map(([d, v]) => [d, hz(v)]) : hz(p.f || 440), t);
      if (p.detune) osc.detune.value = p.detune;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      let node = osc;
      if (p.filter) { const f = ctx.createBiquadFilter(); f.type = p.filter; f.Q.value = p.q == null ? 0.8 : p.q; sweep(f.frequency, p.f2 || 2000, t); osc.connect(f); node = f; }
      node.connect(g); out(g, p);
      osc.start(t); osc.stop(t + dur + 0.02);
    }
    // noise(t, { dur, color, filter, f, q, gain, a, hold, pan, verb, bus, rate })
    function noise(time, p) {
      const t = at(time), dur = p.dur || 0.2;
      if (t + dur < ctx.currentTime || (time < T0 - 0.001 && dur < 1.5)) return;
      const src = ctx.createBufferSource(); src.buffer = noiseBuf[p.color || 'white']; src.loop = true;
      if (p.rate) src.playbackRate.value = p.rate;
      const g = ctx.createGain(); shape(g.gain, t, gainOf(p, 0.3), dur, p.a, p.hold);
      const f = filterNode(p, t);
      if (f) { src.connect(f); f.connect(g); } else src.connect(g);
      out(g, p);
      const off = rand('off' + time + (p.f || ''))() * 2;
      src.start(t, off); src.stop(t + dur + 0.02);
    }

    // ---- named sounds. play(name, t, opts): opts.gain scales the whole sound, opts.pan places it.
    const S = {
      // UI / motion graphics
      pop: (t, o) => { tone(t, { f: [[0, o.f || 620], [0.07, (o.f || 620) * 0.45]], dur: 0.1, gain: 0.32 * o.g, pan: o.pan }); noise(t, { dur: 0.012, filter: 'highpass', f: 3000, gain: 0.12 * o.g, pan: o.pan }); },
      tick: (t, o) => noise(t, { dur: 0.018, filter: 'bandpass', f: o.f || 4200, q: 2.5, gain: 0.3 * o.g, pan: o.pan }),
      click: (t, o) => { tone(t, { f: o.f || 1900, type: 'square', dur: 0.02, gain: 0.08 * o.g, filter: 'lowpass', f2: 3000, pan: o.pan }); noise(t, { dur: 0.01, filter: 'highpass', f: 2500, gain: 0.15 * o.g, pan: o.pan }); },
      tock: (t, o) => { tone(t, { f: o.f || 820, dur: 0.07, gain: 0.25 * o.g, pan: o.pan }); noise(t, { dur: 0.05, filter: 'bandpass', f: o.f || 820, q: 9, gain: 0.35 * o.g, pan: o.pan }); },
      blip: (t, o) => tone(t, { f: o.f || 'E6', type: o.type || 'square', dur: o.dur || 0.07, gain: 0.07 * o.g, a: 0.002, hold: (o.dur || 0.07) * 0.6, pan: o.pan }),
      whoosh: (t, o) => { const d = o.dur || 0.45; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 350], [d * 0.55, o.top || 2600], [d, 700]], q: 0.9, gain: 0.32 * o.g, a: d * 0.5, pan: o.pan, verb: 0.15 }); },
      swish: (t, o) => { const d = o.dur || 0.18; noise(t, { dur: d, filter: 'highpass', f: [[0, 1800], [d, 5200]], q: 0.7, gain: 0.22 * o.g, a: d * 0.35, pan: o.pan }); },
      riser: (t, o) => { const d = o.dur || 0.8; noise(t, { dur: d, color: 'pink', filter: 'bandpass', f: [[0, 300], [d, 4000]], q: 1.2, gain: 0.25 * o.g, a: d * 0.95, pan: o.pan, verb: 0.2 }); tone(t, { f: [[0, 180], [d, 720]], type: 'triangle', dur: d, gain: 0.06 * o.g, a: d * 0.9 }); },
      thud: (t, o) => { tone(t, { f: [[0, o.f || 130], [0.16, 42]], dur: 0.26, gain: 0.55 * o.g, pan: o.pan }); noise(t, { dur: 0.09, color: 'brown', filter: 'lowpass', f: 500, gain: 0.35 * o.g, pan: o.pan }); },

<script>// Transformer decoder, next-word prediction, in the Manim-Style Math look. Pure black, crisp vectors, the Manim palette,

(function () {

    drawTex(ctx, txt(ctx, 'attention', 32, xA - 10, 198, 'right'), { p: seg(31.6, 32.4, t), alpha: lA, col: mixc(C.grey, C.yellow, aOn), scale: 1 + 0.06 * aOn });
    arrow(ctx, xA, 187, xF - 12, 187, C.grey, 2.5, sm(31.9, 32.4, t), 12, lA);

      curvedArrow(ctx, self, C.yellow, 1.5 + 9 * ATT[4], sm(33.4, 33.9, t), 12, arcA * 0.6);
      ATT.forEach((w, j) => drawTex(ctx, txt(ctx, Math.round(w * 100) + '%', 30, AX[j], 600, 'center'), { p: seg(34.2 + j * 0.12, 34.8 + j * 0.12, t), alpha: arcA, col: C.gold }));
      // no peeking ahead: a dashed red attempt at the unknown next word, crossed out

    });
  }

  // ------------------------------------------------------------------ beat 7: a stack of 12 blocks
  function drawStack(ctx, t) {
    const A = 1 - sm(50.6, 51.2, t);
    if (A <= 0.003) return;
    for (let k = 1; k < 12; k++) {
      const y0 = 535 - k * 32.5;
      strokePts(ctx, rectPts(330, y0, 950, y0 + 25), C.white, 2.5, 0, sm(44.0 + k * 0.12, 44.5 + k * 0.12, t), A);
    }
    SX.forEach((x, i) => {
      const pts = [[x, 598], [x, 160]];

  }

  // ------------------------------------------------------------------ beats 8-9: logits, then softmax
  function drawLogits(ctx, t) {
    const out = 1 - sm(68.8, 69.6, t), dyO = 40 * sm(68.8, 69.6, t);

    drawTex(ctx, txt(ctx, 'of context', 28, 1120, 374, 'center'), { alpha: la, col: C.yellow });
    drawTex(ctx, txt(ctx, 'the', 36, 150, 505 + dyO, 'center'), { alpha: mv * out, col: C.yellow });
    if (t < 51.6) return;

    ctx.save(); ctx.translate(0, dyO);
    const A = out;
    arrow(ctx, 186, 355, 330, 355, C.white, 3, sm(51.8, 52.3, t), 16, A);
    // counter: one score for every token in the vocabulary
    const cA = sm(52.2, 52.6, t) * (1 - sm(60.2, 60.6, t)) * A;
    if (cA > 0.003) {
      const s = commas(50257 * H.ease.out(seg(52.3, 53.6, t)));
      ctx.save(); ctx.globalAlpha = cA; ctx.font = fnt(64, false, 600); ctx.fillStyle = C.white; ctx.fillText(s, BX, 178);
      const wN = Math.max(ctx.measureText(s).width, ctx.measureText('50,257').width); ctx.restore();
      drawTex(ctx, txt(ctx, 'scores, one for every token', 30, BX + wN + 20, 178), { alpha: cA, col: C.greyL });
    }
    // axes
    const axP = sm(52.4, 53.2, t), bq = sm(62.2, 63.4, t);
    strokePts(ctx, [[BX, 620], [BX, 225]], C.white, 2.5, 0, axP, A);
    arrow(ctx, BX, 620, 1080, 620, C.white, 2.5, axP, 14, A);
    ctx.save(); ctx.strokeStyle = C.white; ctx.lineWidth = 2;
    for (let k = 1; k <= 7; k++) { const s = SM(axP * 1.5 - k * 0.06); if (s <= 0) continue; ctx.globalAlpha = A * (1 - bq); ctx.beginPath(); ctx.moveTo(BX + k * 80, 613); ctx.lineTo(BX + k * 80, 627); ctx.stroke(); }
    for (let k = 1; k <= 6; k++) { ctx.globalAlpha = A * bq; ctx.beginPath(); ctx.moveTo(BX + k * 90, 613); ctx.lineTo(BX + k * 90, 627); ctx.stroke(); }
    ctx.restore();
    const xl0 = txt(ctx, 'score', 28, 1092, 628, null, { k: 'a' }), xl1 = txt(ctx, 'probability', 28, 1092, 628, null, { k: 'b' });
    if (bq <= 0) drawTex(ctx, xl0, { p: seg(53.0, 53.5, t), alpha: A, col: C.greyL }); else morphTex(ctx, xl0, xl1, bq, { alpha: A, colA: () => C.greyL, colB: () => C.greyL });

    // bars: score (logit) → probability
    const ind = tab(65.2, 65.9, t), big = sm(65.0, 65.8, t), matY = sm(65.2, 65.5, t);
    ROWS.forEach((r, i) => {
      const y = RY[i], g = sm(53.0 + i * 0.35, 53.7 + i * 0.35, t), len = lerp(r.z * 80, r.p * 9, bq) * g;
      const labA = i === 0 && t >= 68.8 ? 0 : A;   // "mat" leaves the chart for the sentence in the next beat

    const fp = seg(60.6, 62.0, t);

      const fx = 790;

      drawTex(ctx, layout(ctx, [T('e'), T('score', { it: true, sz: 0.56, dy: -0.46 })], 52, fx + 80, 132, 'center'), { p: fp, alpha: A, col: (g) => (g.ch === 'e' ? C.white : C.blue) });

      drawTex(ctx, layout(ctx, [T('Σ '), T('e'), T('score', { it: true, sz: 0.56, dy: -0.46 })], 52, fx + 80, 198, 'center'), { p: seg(61.0, 62.2, t), alpha: A, col: (g) => (g.ch === 'Σ' || g.ch === 'e' ? C.white : C.blue) });

  // ------------------------------------------------------------------ beat 10: append and go again
  function sentence(ctx) {
    ctx.font = fnt(54); const sp = ctx.measureText(' ').width, xs = []; let x = 0;

  }

    const ulA = 1 - sm(79.6, 80.3, t);

      }

    });

    // the pipeline as one row, looping back

    if (PA <= 0.003) return;

    STAGES.forEach((s, i) => { pos.push([x, x + ws[i]]); x += ws[i] + gap; });
    const act = STAGES.map(() => 0);
    CYC.forEach(([a, b]) => { const d = b - a; STAGES.forEach((s, k) => { act[k] = Math.max(act[k], tab(a + d * (0.12 + k * 0.11), a + d * (0.12 + (k + 1) * 0.11 + 0.06), t)); }); });
    STAGES.forEach((s, i) => {
      const L = txt(ctx, s, 32, pos[i][0], PY);
      drawTex(ctx, L, { p: cl(seg(69.8, 70.8, t) * 1.5 - i * 0.1), alpha: PA, col: mixc(C.white, C.yellow, act[i]), scale: 1 + 0.1 * act[i], oy: PY - 11 });
      if (i < STAGES.length - 1) arrow(ctx, pos[i][1] + 12, PY - 11, pos[i + 1][0] - 12, PY - 11, C.white, 2.5, sm(70.0 + i * 0.12, 70.4 + i * 0.12, t), 12, PA * 0.85);
    });
    // where the next token will go
    let ni = 6; CYC.forEach(([a, b]) => { if (t >= b) ni++; });
    const boxOf = (i) => (i < 10 ? [Ls[i].cx, Math.max(40, Ls[i].w + 10)] : [Ls[9].x1 + 40, 40]);
    let [bx, bw] = boxOf(ni);
    if (ni > 6) { const m = sm(CYC[ni - 7][1], CYC[ni - 7][1] + 0.35, t), [px, pw] = boxOf(ni - 1); bx = lerp(px, bx, m); bw = lerp(pw, bw, m); }
    const boxA = PA * (1 - sm(78.4, 78.8, t));
    strokePts(ctx, rectPts(bx - bw / 2, 172, bx + bw / 2, 238), C.yellow, 3, 0, sm(69.9, 70.5, t), boxA);
    const qA = boxA * (1 - tab(ni > 6 ? CYC[ni - 7][1] - 0.05 : 0, ni > 6 ? CYC[ni - 7][1] + 0.4 : 0, t));
    drawTex(ctx, txt(ctx, '?', 44, bx, 221, 'center'), { p: seg(70.2, 70.7, t), alpha: qA, col: C.yellow });
    // down into the pipeline, and back up into the text
    const c0 = (pos[0][0] + pos[0][1]) / 2, c5 = (pos[5][0] + pos[5][1]) / 2;
    const down = arcPts(Ls[0].cx, 250, c0, PY - 42, 0.12, 30), up = arcPts(c5, PY - 42, bx, 250, 0.2, 30);
    curvedArrow(ctx, down, C.white, 2.5, sm(70.2, 70.8, t), 13, PA * 0.85);
    curvedArrow(ctx, up, C.white, 2.5, sm(70.5, 71.1, t), 13, boxA * 0.85);
    CYC.forEach(([a, b]) => {
      const d = b - a, du = seg(a, a + d * 0.14, t), uu = seg(a + d * 0.8, a + d * 0.96, t);
      if (du > 0 && du < 1) flash(ctx, down, SM(du), C.yellow, 5, 0.4, PA);
      if (uu > 0 && uu < 1) flash(ctx, up, SM(uu), C.yellow, 5, 0.4, PA);
    });
  }

  // ------------------------------------------------------------------ beat 11: takeaway
  function drawTake(ctx, t) {
    const tp = seg(80.4, 82.0, t), y = 410, gap = 96;
    const a0 = layout(ctx, [T('Predict', { c: C.blue }), T(' one token')], 50, 0, 0), b0 = layout(ctx, [T('add it', { c: C.teal })], 50, 0, 0), c0 = layout(ctx, [T('repeat', { c: C.yellow })], 50, 0, 0);
    const x0 = 640 - (a0.w + b0.w + c0.w + gap * 2) / 2;
    const A = layout(ctx, [T('Predict', { c: C.blue }), T(' one token')], 50, x0, y), B = layout(ctx, [T('add it', { c: C.teal })], 50, x0 + a0.w + gap, y), Cc = layout(ctx, [T('repeat', { c: C.yellow })], 50, x0 + a0.w + b0.w + gap * 2, y);
    drawTex(ctx, A, { p: cl(tp * 2.6) });
    arrow(ctx, A.x1 + 20, y - 16, B.x0 - 20, y - 16, C.white, 3.5, sm(0.3, 0.45, tp), 18);
    drawTex(ctx, B, { p: cl(tp * 2.6 - 1.0) });
    arrow(ctx, B.x1 + 20, y - 16, Cc.x0 - 20, y - 16, C.white, 3.5, sm(0.55, 0.7, tp), 18);
    drawTex(ctx, Cc, { p: cl(tp * 2.6 - 1.6) });
    const F = layout(ctx, [T('P', { it: true }), T('('), T('next token', { c: C.blue }), T('  |  '), T('all tokens so far', { c: C.teal }), T(')')], 44, 640, 528, 'center');
    const ind = tab(83.7, 84.4, t);
    drawTex(ctx, F, { p: seg(82.2, 83.2, t), scale: 1 + 0.1 * ind, oy: 512, col: (g) => (ind > 0 ? mixc(g.c, C.yellow, ind) : g.c) });
    strokePts(ctx, rectPts(F.x0 - 22, 528 - 46, F.x1 + 22, 528 + 22), C.yellow, 3.5, 0, sm(83.4, 84.0, t));
    drawTex(ctx, txt(ctx, 'what a decoder works out, one token at a time', 30, 640, 598, 'center'), { p: seg(83.0, 83.9, t), col: C.greyL });
  }

  // ------------------------------------------------------------------ the explainer
  function explainer(ctx, W, Hh, t) {
    ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, Hh);
    drawHeader(ctx, t);
    drawStep(ctx, t);
    if (t < 51.6) drawTokens(ctx, t);
    if (t > 29.9 && t < 51.6) drawBlock(ctx, t);
    if (t > 43.9 && t < 51.6) drawStack(ctx, t);
    if (t > 48.9 && t < 70.0) drawLogits(ctx, t);
    if (t > 68.7) drawLoop(ctx, t);
    if (t > 80.3) drawTake(ctx, t);
    drawCaps(ctx, t);
  }

  window.TF = { explainer, D, C, CYC, STAGES, ROWS, ATT, sm, seg, tab, SM };
})();
</script>
<script>// Sound design: gentle, warm and sparse, like the soft score under a math explainer. Times match the picture in core.js.
(function () {
  const { sm, seg, CYC } = TF;
  function scoreSound(k) {
    const D = TF.D;
    const pluck = (t, f, g = 1, o = {}) => {
      k.tone(t, { f, type: 'triangle', dur: 0.55, gain: 0.1 * g, a: 0.004, filter: 'lowpass', f2: 1300, verb: 0.3, pan: o.pan || 0, minor: o.minor });
      k.tone(t, { f: k.hz(f) * 2, dur: 0.22, gain: 0.025 * g, a: 0.003, verb: 0.25, pan: o.pan || 0, minor: o.minor });
    };
    const tick = (t, g = 1, f = 1300, pan = 0) => k.noise(t, { dur: 0.02, filter: 'bandpass', f, q: 2.2, gain: 0.16 * g, a: 0.002, pan, minor: true });
    // pencil-soft write: a few ticks across the write
    const write = (t0, t1, n, g = 1, pan = 0) => k.withMinor(() => { for (let i = 0; i < n; i++) tick(t0 + (t1 - t0) * (i + 0.3) / n, g * (0.7 + 0.3 * ((i * 7) % 3) / 2), 1100 + ((i * 5) % 4) * 90, pan); });
    // airy swish for Transforms
    const swish = (t, dur, g = 1, pan = 0, minor) => k.noise(t, { dur, color: 'pink', filter: 'bandpass', f: [[0, 300], [dur * 0.55, 1300], [dur, 500]], q: 0.7, gain: 0.13 * g, a: dur * 0.5, verb: 0.25, pan, minor });
    // counter ticks: at most one per `gap` seconds, only when the shown value changes
    const counter = (val, a, b, gap, g, f) => { let last = -1, prev = val(a); for (let t = a; t <= b; t += 0.002) { const v = val(t); if (v !== prev && t - last >= gap) { tick(t, g, f, -0.2); last = t; } prev = v; } };
    const chord = (t, notes, g = 1, dur = 1.8) => notes.forEach((n, i) => k.tone(t + 0.02 + i * 0.05, { f: n, type: 'triangle', dur, gain: 0.07 * g, a: 0.02, filter: 'lowpass', f2: 1500, verb: 0.45, pan: (i - (notes.length - 1) / 2) * 0.3 }));

    // ---- warm pad underneath, resolving to D under the takeaway
    k.music('pad', 0, 80.4, { bpm: 60, gain: 0.45, chords: [['D3', 'A3', 'C#4', 'F#4'], ['B2', 'F#3', 'A3', 'D4'], ['G2', 'D3', 'F#3', 'B3'], ['A2', 'E3', 'G3', 'C#4']] });
    k.music('pad', 80.4, D, { bpm: 60, gain: 0.45, chords: [['D3', 'A3', 'D4', 'F#4']] });

    // ---- 1 hook
    pluck(0.12, 'D4', 0.9);
    write(0.1, 1.5, 6, 0.9);
    swish(1.7, 0.8, 1.0);
    write(2.2, 3.6, 5, 0.8);
    pluck(3.25, 'A4', 0.7, { pan: 0.3 });

    // ---- 2 tokens
    swish(4.0, 1.0, 0.8);
    ['D4', 'E4', 'F#4', 'A4', 'B4'].forEach((n, i) => pluck(5.3 + i * 0.18, n, 0.6, { pan: -0.6 + i * 0.3, minor: true }));
    write(6.4, 7.9, 5, 0.8);
    swish(7.9, 0.5, 0.45, 0, true);

    // ---- 3 embeddings
    [0, 1, 2, 3, 4].forEach((i) => tick(13.75 + i * 0.15, 0.7, 1500, -0.6 + i * 0.3));
    write(13.8, 15.7, 8, 0.7);
    counter((t) => Math.round(768 * (1 - Math.pow(1 - seg(16.0, 17.0, t), 3))), 16.0, 17.0, 0.085, 0.9, 1250);
    pluck(17.0, 'A4', 0.8, { pan: 0.5 });

    // ---- 4 positions
    ['D5', 'E5', 'F#5', 'A5', 'B5'].forEach((n, i) => pluck(22.5 + i * 0.12, n, 0.35, { pan: -0.6 + i * 0.3, minor: true }));
    [0, 1, 2, 3, 4].forEach((i) => k.play('stroke', 23.4 + i * 0.15, { material: 'pen', dur: 0.8, gain: 0.45, pan: -0.6 + i * 0.3 }));
    swish(25.2, 1.0, 0.8);
    k.tone(25.8, { f: 'D4', type: 'triangle', dur: 1.2, gain: 0.07, a: 0.08, filter: 'lowpass', f2: 1200, verb: 0.35 });

    // ---- 5 attention
    swish(30.0, 1.0, 0.7);
    k.noise(30.8, { dur: 1.0, color: 'pink', filter: 'bandpass', f: [[0, 400], [0.9, 900]], q: 0.8, gain: 0.06, a: 0.4, minor: true });
    write(31.2, 32.6, 4, 0.7);
    ['A4', 'F#4', 'D4', 'A3'].forEach((n, i) => pluck(32.85 + i * 0.3, n, 0.7, { pan: 0.4 - i * 0.25 }));
    pluck(33.8, 'F#5', 0.3, { pan: 0.5, minor: true });
    write(34.2, 35.3, 5, 0.7);
    // the wrong move: a low, soft minor fall on the red ✗
    k.tone(35.9, { f: 'F3', type: 'triangle', dur: 0.5, gain: 0.14, a: 0.01, filter: 'lowpass', f2: 900, verb: 0.3, pan: 0.6 });
    k.tone(36.06, { f: 'C#3', type: 'triangle', dur: 0.8, gain: 0.14, a: 0.01, filter: 'lowpass', f2: 800, verb: 0.35, pan: 0.6 });
    // context flows back into "the"
    k.tone(36.4, { f: [[0, 600], [0.8, 250]], type: 'sine', dur: 0.9, gain: 0.06, a: 0.25, hold: 0.2, filter: 'lowpass', f2: 900, verb: 0.3, pan: 0.3 });
    k.noise(36.9, { dur: 0.9, color: 'pink', filter: 'bandpass', f: [[0, 400], [0.8, 750]], q: 1, gain: 0.05, a: 0.4, minor: true });

    // ---- 6 feed-forward
    swish(38.6, 0.5, 0.4, 0.3, true);
    ['D5', 'E5', 'F#5', 'A5', 'D6'].forEach((n, i) => k.play('blip', 40.05 + i * 0.08, { f: n, type: 'triangle', dur: 0.09, gain: 0.9, pan: -0.6 + i * 0.3 }));
    k.noise(40.6, { dur: 1.0, color: 'pink', filter: 'bandpass', f: [[0, 450], [0.9, 800]], q: 1, gain: 0.05, a: 0.4, minor: true });

    // ---- 7 stack
    swish(43.0, 1.2, 0.9);
    for (let s = 1; s < 12; s++) tick(44.3 + s * 0.12, 0.6, 900 + s * 70, 0);
    [46.2, 47.0, 47.8].forEach((t0, i) => k.noise(t0, { dur: 1.3, color: 'pink', filter: 'bandpass', f: [[0, 350], [1.2, 1500 + i * 200]], q: 1.1, gain: 0.08, a: 1.0, verb: 0.25 }));
    pluck(46.6, 'D4', 0.9, { pan: -0.5 }); k.tone(46.6, { f: 'D2', dur: 0.8, gain: 0.12, a: 0.01 });
    pluck(49.2, 'A4', 0.8, { pan: 0.5 });

    // ---- 8 logits (scene change)
    swish(50.6, 1.2, 1.0, -0.2);
    tick(52.3, 0.8, 1500);
    counter((t) => Math.round(50257 * (1 - Math.pow(1 - seg(52.3, 53.6, t), 3)) / 600), 52.35, 53.6, 0.085, 0.9, 1250);
    pluck(53.65, 'A4', 0.7);
    ['A4', 'F#4', 'E4', 'D4', 'A3'].forEach((n, i) => pluck(53.6 + i * 0.35, n, 0.55, { pan: 0.1 + i * 0.1, minor: true }));

    // ---- 9 softmax: the key moment
    write(60.6, 62.2, 6, 0.8);
    swish(62.2, 1.2, 0.9);
    write(63.8, 64.6, 3, 0.6);
    k.noise(64.8, { dur: 0.6, filter: 'bandpass', f: [[0, 600], [0.5, 1100]], q: 1.2, gain: 0.05, a: 0.15, minor: true });
    k.tone(65.2, { f: 'D2', type: 'sine', dur: 2.0, gain: 0.3, a: 0.02, verb: 0.2 });
    k.tone(65.2, { f: 'D3', type: 'triangle', dur: 1.6, gain: 0.08, a: 0.02, filter: 'lowpass', f2: 700, verb: 0.3 });
    chord(65.2, ['A3', 'D4', 'F#4', 'A4']);

    // ---- 10 loop
    swish(68.8, 1.1, 1.0, -0.2);
    write(69.8, 70.8, 6, 0.6);
    CYC.forEach(([a, b], c) => {
      const d = b - a;
      [0, 1, 2, 3, 4, 5].forEach((s) => tick(a + d * (0.12 + s * 0.11) + 0.04, 0.55, 1000 + s * 120, -0.5 + s * 0.2));
      k.play('pop', b, { f: 560 + c * 90, gain: 0.55, pan: 0.2 });
      pluck(b + 0.02, ['D4', 'F#4', 'A4', 'D5'][c], 0.6, { pan: 0.2 });
    });

    // ---- 11 takeaway: resolving chord
    swish(79.6, 0.7, 0.7, 0, true);
    write(80.4, 82.0, 6, 0.8);
    ['D3', 'A3', 'D4', 'F#4', 'A4'].forEach((n, i) => k.tone(80.8 + i * 0.06, { f: n, type: i ? 'sine' : 'triangle', dur: 2.4, gain: 0.075, a: 0.03, verb: 0.5, pan: (i - 2) * 0.22 }));
    k.tone(80.8, { f: 'D2', dur: 2.4, gain: 0.16, a: 0.04 });
    write(82.2, 83.2, 5, 0.6);
    k.noise(83.4, { dur: 0.6, filter: 'bandpass', f: [[0, 600], [0.5, 1100]], q: 1.2, gain: 0.04, a: 0.15, minor: true });
    pluck(83.75, 'F#5', 0.5); pluck(83.85, 'A5', 0.45);
  }
  window.scoreSound = scoreSound;
})();
</script>
<script>
(function () {
  const DURATION = TF.D;
  window.DURATION = DURATION;
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage'), scrub = document.getElementById('scrub'), timeEl = document.getElementById('time');
  const playBtn = document.getElementById('play'), sndBtn = document.getElementById('snd'), loopBtn = document.getElementById('loop');
  const PLAY = '<svg viewBox="0 0 14 14"><path d="M2 1l11 6-11 6z"/></svg>', PAUSE = '<svg viewBox="0 0 14 14"><path d="M2 1h4v12H2zM8 1h4v12H8z"/></svg>';
  let t = 0, playing = false, soundOn = true, loop = true, last = 0, stopSound = null, ready = false;

  // letterbox: keep 16:9, backing store at device resolution
  function fit() {
    const w = stage.clientWidth, h = stage.clientHeight, s = Math.min(w / 1280, h / 720);
    const cw = Math.floor(1280 * s), ch = Math.floor(720 * s), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
    const bw = Math.max(1, Math.round(cw * dpr)), bh = Math.max(1, Math.round(ch * dpr));
    if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
    draw();
  }
  function draw() {
    if (!ready) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
    ctx.save(); ctx.scale(canvas.width / 1280, canvas.height / 720);
    TF.explainer(ctx, 1280, 720, t);
    ctx.restore();
  }
  const fmt = (s) => { const m = Math.floor(s / 60), r = s - m * 60; return m + ':' + r.toFixed(1).padStart(4, '0'); };
  function ui() { scrub.value = t; timeEl.textContent = fmt(t) + ' / ' + fmt(DURATION).replace(/\.0$/, ''); }
  function killSound() { if (stopSound) { stopSound(); stopSound = null; } }
  function startSound() { killSound(); if (soundOn && playing) { try { stopSound = SOUND.live(window.scoreSound, t, { voiceover: false }); } catch (e) { stopSound = null; } } }

  window.seek = (tt) => { t = Math.max(0, Math.min(DURATION, tt)); draw(); ui(); };
  window.scoreSound = window.scoreSound;

  function frame(now) {
    if (!playing) return;
    t += Math.min(0.1, (now - last) / 1000); last = now;
    if (t >= DURATION) {
      if (loop) { t = 0; startSound(); } else { t = DURATION; setPlaying(false); }
    }
    draw(); ui();
    requestAnimationFrame(frame);
  }
  function setPlaying(p) {
    playing = p;
    playBtn.innerHTML = p ? PAUSE : PLAY; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play');
    if (p) { if (t >= DURATION - 0.01) t = 0; last = performance.now(); startSound(); requestAnimationFrame(frame); }
    else killSound();
  }
  playBtn.addEventListener('click', () => setPlaying(!playing));
  scrub.addEventListener('input', () => { killSound(); window.seek(parseFloat(scrub.value)); });
  scrub.addEventListener('change', () => { if (playing) startSound(); });
  sndBtn.addEventListener('click', () => { soundOn = !soundOn; sndBtn.setAttribute('aria-pressed', soundOn); if (soundOn) startSound(); else killSound(); });
  loopBtn.addEventListener('click', () => { loop = !loop; loopBtn.setAttribute('aria-pressed', loop); });
  document.addEventListener('keydown', (e) => { if (e.code === 'Space' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); } });
  window.addEventListener('resize', fit);
  // ?embed: report height to the host page, and pause when the host hides the tab
  if (new URLSearchParams(location.search).has('embed')) {
    document.documentElement.classList.add('embed');
    new ResizeObserver(() => { fit(); parent.postMessage({ filmHeight: document.body.getBoundingClientRect().height + 2 }, '*'); }).observe(document.body);
    addEventListener('message', (e) => { if (e.data === 'film:hide' && playing) setPlaying(false); });
  }

  (async () => {
    try { await Promise.all(['400 52px "STIX Two Text"', 'italic 400 52px "STIX Two Text"', '600 52px "STIX Two Text"'].map((f) => document.fonts.load(f, 'AaZz09Σ−×“”'))); } catch (e) {}
    ready = true; window.seek(0); fit();
  })();
})();
</script>
